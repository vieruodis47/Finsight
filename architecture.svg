  <rect x="1010" y="18" width="330" height="88" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="1026" y="32" width="26" height="14" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
